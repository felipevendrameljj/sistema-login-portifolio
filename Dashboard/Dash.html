<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="../Style/Style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Controle de Gastos</h1>
    <div><span id="userName"></span> <button id="btnLogout" class="outline">Sair</button></div>
  </header>

  <main class="wrap">
    <section class="form">
      <input id="description" placeholder="Descrição (Ex: Pizza)">
      <select id="category">
        <option>Alimentação</option>
        <option>Transporte</option>
        <option>Moradia</option>
        <option>Lazer</option>
        <option>Saúde</option>
        <option>Outros</option>
      </select>
      <input id="amount" type="number" min="0" step="0.01" placeholder="Valor (R$)">
      <button id="btnAdd">Adicionar</button>
    </section>

    <p class="total">Total: <strong id="total">R$ 0,00</strong></p>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Data</th><th></th></tr></thead>
        <tbody id="expensesBody"></tbody>
      </table>
      <p id="empty" class="msg">Nenhum gasto cadastrado ainda.</p>
    </div>

    <div class="chart"><canvas id="expenseChart"></canvas></div>
  </main>

  <script type="module" src="Dash.js"></script>
</body>
</html>

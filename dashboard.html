<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tabela de Gastos</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h1>Tabela de Gastos</h1>

<div class="expense-form">
  <input id="category" placeholder="Categoria">
  <input id="description" placeholder="Descrição">
  <input id="amount" type="number" placeholder="Valor">
  <button onclick="addExpense()">Adicionar</button>
</div>

<table id="expensesTable">
  <thead>
    <tr>
      <th>Categoria</th>
      <th>Descrição</th>
      <th>Valor</th>
      <th>Data</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<canvas id="expenseChart" width="400" height="400"></canvas>
</body>
</html>

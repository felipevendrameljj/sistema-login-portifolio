<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login / Cadastro</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="script.js"></script>
</head>
<body>

<div class="container">
  <h1>Bem-vindo!</h1>

  <!-- Caixa de Login -->
  <div id="login-box" class="box">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p id="loginMsg"></p>
    <p>Não tem conta? <span onclick="toggleForm()">Cadastre-se</span></p>

    <div class="social-login">
      <img src="assets/logos/google.png" onclick="socialLogin('google')" alt="Google">
      <img src="assets/logos/facebook.png" onclick="socialLogin('facebook')" alt="Facebook">
      <img src="assets/logos/github.png" onclick="socialLogin('github')" alt="GitHub">
    </div>
  </div>

  <!-- Caixa de Cadastro -->
  <div id="register-box" class="box" style="display:none;">
    <input id="name" type="text" placeholder="Nome">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Senha">
    <button onclick="register()">Cadastrar</button>
    <p id="msg"></p>
    <p>Já tem conta? <span onclick="toggleForm()">Login</span></p>
  </div>
</div>

</body>
</html>

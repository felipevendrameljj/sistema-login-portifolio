<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Financeiro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>Bem-vindo, <span id="userName"></span>!</h2>
  <h3>Saldo: R$ <span id="balance">0.00</span></h3>

  <div class="transaction-form">
    <input type="text" id="desc" placeholder="Descrição">
    <input type="number" id="amount" placeholder="Valor (positivo ou negativo)">
    <button onclick="addTransaction()">Adicionar</button>
  </div>

  <div class="transactions">
    <h3>Transações</h3>
    <ul id="transactionList"></ul>
  </div>

  <button onclick="logout()">Sair</button>
</div>
<script src="dashboard.js"></script>
</body>
</html>

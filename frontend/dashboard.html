<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
h2 { color: #1877f2; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background: #1877f2; color: white; }
input, select { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
button { padding: 10px 15px; background: #1877f2; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
button:hover { background: #145dbf; }
</style>
</head>
<body>
<div class="container">
<h2>Dashboard Financeiro</h2>
<p>Olá, <span id="userName"></span>!</p>

<h3>Adicionar Gasto</h3>
<select id="category">
  <option value="">Selecione Categoria</option>
  <option value="Alimentação">Alimentação</option>
  <option value="Transporte">Transporte</option>
  <option value="Lazer">Lazer</option>
  <option value="Moradia">Moradia</option>
  <option value="Outros">Outros</option>
</select>
<input type="text" id="description" placeholder="Descrição (opcional)">
<input type="number" id="amount" placeholder="Valor" step="0.01">
<button onclick="addExpense()">Adicionar</button>

<h3>Gastos</h3>
<table id="expensesTable">
  <thead>
    <tr>
      <th>Categoria</th>
      <th>Descrição</th>
      <th>Valor</th>
      <th>Data</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h3>Resumo de Gastos por Categoria</h3>
<canvas id="expensesChart" width="400" height="200"></canvas>
</div>

<script src="dashboard.js"></script>
<script>
document.getElementById('userName').innerText = localStorage.getItem('userName') || '';
</script>
</body>
</html>

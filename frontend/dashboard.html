<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela de Gastos</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Tabela de Gastos</h1>

    <div class="expense-form">
      <input type="text" id="category" placeholder="Categoria">
      <input type="text" id="description" placeholder="Descrição">
      <input type="number" id="amount" placeholder="Valor">
      <button onclick="addExpense()">Adicionar Gasto</button>
    </div>

    <div class="table-container">
      <table id="expensesTable">
        <thead>
          <tr>
            <th>Categoria</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

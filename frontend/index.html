<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela de Gastos - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tabela de Gastos</h1>

    <div class="form-container">

      <!-- Cadastro -->
      <div class="form-box" id="register-box">
        <h2>Cadastrar</h2>
        <input type="text" id="name" placeholder="Nome">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="register()">Cadastrar</button>
        <p id="msg" class="msg"></p>
        <p>Já tem conta? <a href="#" onclick="toggleForm()">Entrar</a></p>
      </div>

      <!-- Login -->
      <div class="form-box" id="login-box" style="display:none;">
        <h2>Login</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <p id="loginMsg" class="msg"></p>
        <p>Não tem conta? <a href="#" onclick="toggleForm()">Cadastrar</a></p>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
